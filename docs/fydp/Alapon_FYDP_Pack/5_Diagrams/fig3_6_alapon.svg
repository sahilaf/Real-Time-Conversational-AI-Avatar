<?xml version="1.0" encoding="UTF-8"?>
<svg width="860" height="290" viewBox="0 40 860 290" role="img" aria-label="Alapon: a fixed reference frame, the current frame with mouth and jaw hidden, and streamed audio features enter the U-Net, which paints the mouth back into the frame. Inset: the original mask left the jaw visible; Alapon hides it." font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#121A2A"/></marker>
    <marker id="b4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A78D6"/></marker>
    <marker id="g4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A8A69D"/></marker>
  </defs>
  <rect width="860" height="330" fill="#ffffff"/>
  <!-- inputs -->
  <g stroke="#A8A69D" stroke-width="1.2" fill="#F3F2EF">
    <rect x="10" y="55" width="160" height="50" rx="6"/>
    <rect x="10" y="135" width="160" height="50" rx="6"/>
    <rect x="10" y="215" width="160" height="50" rx="6"/>
  </g>
  <g font-size="12.5" fill="#121A2A" text-anchor="middle">
    <text x="90" y="76">Reference frame</text><text x="90" y="93" font-size="11.5" fill="#52514E">(one fixed frame)</text>
    <text x="90" y="156">Current frame,</text><text x="90" y="173" font-size="11.5" fill="#52514E">mouth and jaw hidden</text>
    <text x="90" y="236">Audio features</text><text x="90" y="253" font-size="11.5" fill="#52514E">(streamed live)</text>
  </g>
  <!-- U-Net -->
  <rect x="240" y="65" width="160" height="190" rx="6" fill="#E3EEFB" stroke="#2A78D6" stroke-width="1.8"/>
  <text x="320" y="155" font-size="16" font-weight="700" fill="#1C5CAB" text-anchor="middle">Alapon</text>
  <text x="320" y="174" font-size="13" fill="#1C5CAB" text-anchor="middle">U-Net</text>
  <!-- output and training-only expert -->
  <rect x="450" y="135" width="160" height="50" rx="6" fill="#ffffff" stroke="#A8A69D" stroke-width="1.2"/>
  <text x="530" y="156" font-size="12.5" fill="#121A2A" text-anchor="middle">Generated mouth</text>
  <text x="530" y="173" font-size="11.5" fill="#52514E" text-anchor="middle">pasted into frame</text>
  <rect x="240" y="285" width="160" height="40" rx="6" fill="#ffffff" stroke="#A8A69D" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="320" y="301" font-size="12.5" fill="#121A2A" text-anchor="middle">Bangla lip-sync expert</text>
  <text x="320" y="317" font-size="11.5" fill="#52514E" text-anchor="middle">(training only)</text>
  <!-- arrows -->
  <line x1="170" y1="80" x2="238" y2="80" stroke="#121A2A" stroke-width="1.6" marker-end="url(#a4)"/>
  <line x1="170" y1="160" x2="238" y2="160" stroke="#121A2A" stroke-width="1.6" marker-end="url(#a4)"/>
  <line x1="170" y1="240" x2="238" y2="240" stroke="#2A78D6" stroke-width="1.8" marker-end="url(#b4)"/>
  <line x1="400" y1="160" x2="448" y2="160" stroke="#2A78D6" stroke-width="1.8" marker-end="url(#b4)"/>
  <path d="M530,185 V305 H402" fill="none" stroke="#A8A69D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#g4)"/>
  <rect x="440" y="297" width="58" height="16" fill="#ffffff"/>
  <text x="469" y="309" font-size="11.5" fill="#52514E" text-anchor="middle">sync loss</text>
  <!-- mask inset -->
  <text x="705" y="60" font-size="13" font-weight="700" fill="#EB6834" text-anchor="middle">Original mask</text>
  <rect x="670" y="75" width="70" height="160" fill="#ffffff" stroke="#A8A69D" stroke-width="1.2"/>
  <rect x="677.5" y="150" width="55" height="72.5" fill="#121A2A"/>
  <rect x="677.5" y="222.5" width="55" height="12.5" fill="#FDEBE3" stroke="#EB6834" stroke-width="1.6"/>
  <text x="705" y="252" font-size="11.5" fill="#EB6834" text-anchor="middle">jaw visible</text>
  <text x="800" y="60" font-size="13" font-weight="700" fill="#1C5CAB" text-anchor="middle">Alapon</text>
  <rect x="765" y="75" width="70" height="160" fill="#ffffff" stroke="#A8A69D" stroke-width="1.2"/>
  <rect x="772.5" y="150" width="55" height="85" fill="#121A2A"/>
  <text x="800" y="196" font-size="11.5" fill="#ffffff" text-anchor="middle">hidden</text>
  <text x="800" y="252" font-size="11.5" fill="#1C5CAB" text-anchor="middle">jaw hidden</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="One conversation turn: the browser gets a token and joins LiveKit; user audio reaches the Bangla agent; a local voice detector ends the turn; Gemini returns Bangla speech; the agent streams it to the avatar server, where Alapon renders frames on the laptop GPU; frames and audio are published back to the browser." font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#121a2a"/></marker>
          </defs>
          <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

          <!-- zones -->
          <rect x="290" y="20" width="890" height="150" rx="10" fill="#f5f7fa" stroke="#c3cad6" stroke-dasharray="6 5"/>
          <text x="306" y="42" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#7a8396">CLOUD</text>
          <rect x="20" y="230" width="230" height="370" rx="10" fill="#f5f7fa" stroke="#c3cad6" stroke-dasharray="6 5"/>
          <text x="36" y="588" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#7a8396">USER'S BROWSER</text>
          <rect x="290" y="230" width="890" height="370" rx="10" fill="#f5f7fa" stroke="#c3cad6" stroke-dasharray="6 5"/>
          <text x="540" y="588" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#7a8396">LAPTOP · RTX 3050 LAPTOP GPU, 4 GB</text>

          <!-- cloud services -->
          <rect x="320" y="58" width="250" height="86" rx="6" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.5"/>
          <text x="336" y="86" font-size="16" font-weight="700" fill="#121a2a">LiveKit Cloud</text>
          <text x="336" y="108" font-size="13" fill="#4a5468">routes real-time audio and</text>
          <text x="336" y="126" font-size="13" fill="#4a5468">video over WebRTC</text>
          <rect x="880" y="58" width="270" height="86" rx="6" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.5"/>
          <text x="896" y="86" font-size="16" font-weight="700" fill="#121a2a">Gemini 3.1 Flash Live</text>
          <text x="896" y="108" font-size="13" fill="#4a5468">speech in, speech out</text>
          <text x="896" y="126" font-size="13" fill="#4a5468">formal-register Bangla persona</text>

          <!-- browser -->
          <rect x="40" y="280" width="190" height="150" rx="6" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.5"/>
          <text x="56" y="308" font-size="16" font-weight="700" fill="#121a2a">Web client</text>
          <text x="56" y="334" font-size="13" fill="#4a5468">microphone</text>
          <text x="56" y="356" font-size="13" fill="#4a5468">avatar video and voice</text>
          <text x="56" y="378" font-size="13" fill="#4a5468">live Bangla transcript</text>
          <text x="56" y="400" font-size="13" fill="#4a5468">connect · mute</text>

          <!-- token server -->
          <rect x="320" y="500" width="200" height="72" rx="6" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.5"/>
          <text x="336" y="526" font-size="15" font-weight="700" fill="#121a2a">Token server</text>
          <text x="336" y="546" font-size="13" fill="#4a5468">Flask · port 5000</text>
          <text x="336" y="563" font-size="13" fill="#4a5468">issues LiveKit tokens</text>

          <!-- agent -->
          <rect x="320" y="268" width="340" height="170" rx="6" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.5"/>
          <text x="336" y="294" font-size="15" font-weight="700" fill="#121a2a">Bangla agent · LiveKit Agents</text>
          <rect x="336" y="310" width="150" height="62" rx="5" fill="#f5f7fa" stroke="#d3d9e3"/>
          <text x="348" y="332" font-size="14" font-weight="700" fill="#121a2a">Silero VAD</text>
          <text x="348" y="350" font-size="12.5" fill="#4a5468">ends the turn after</text>
          <text x="348" y="365" font-size="12.5" fill="#4a5468">0.55 s of silence</text>
          <circle cx="472" cy="326" r="9" fill="#121a2a"/>
          <text x="472" y="330" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
          <rect x="496" y="310" width="150" height="62" rx="5" fill="#f5f7fa" stroke="#d3d9e3"/>
          <text x="508" y="332" font-size="14" font-weight="700" fill="#121a2a">Gemini session</text>
          <text x="508" y="350" font-size="12.5" fill="#4a5468">transcription pinned</text>
          <text x="508" y="365" font-size="12.5" fill="#4a5468">to bn-BD</text>
          <rect x="336" y="382" width="310" height="44" rx="5" fill="#f5f7fa" stroke="#d3d9e3"/>
          <text x="348" y="401" font-size="14" font-weight="700" fill="#121a2a">Publisher</text>
          <text x="348" y="418" font-size="12.5" fill="#4a5468">plays audio against its frames; audio never waits</text>

          <!-- avatar server -->
          <rect x="780" y="268" width="380" height="310" rx="6" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.5"/>
          <text x="796" y="294" font-size="15" font-weight="700" fill="#121a2a">Avatar server · FastAPI, port 5001</text>
          <rect x="796" y="306" width="348" height="50" rx="5" fill="#f5f7fa" stroke="#d3d9e3"/>
          <text x="812" y="327" font-size="14" font-weight="700" fill="#121a2a">Streaming audio features</text>
          <text x="812" y="345" font-size="12.5" fill="#4a5468">chunk by chunk, identical to offline extraction</text>
          <rect x="796" y="372" width="348" height="56" rx="5" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.8"/>
          <text x="812" y="396" font-size="16" font-weight="700" fill="#1c5cab">Alapon U-Net</text>
          <text x="812" y="416" font-size="12.5" fill="#1c5cab">49 MB · 30 fps · 0.3 GB of GPU memory</text>
          <rect x="796" y="444" width="348" height="50" rx="5" fill="#f5f7fa" stroke="#d3d9e3"/>
          <text x="812" y="465" font-size="14" font-weight="700" fill="#121a2a">JPEG frames + segment packets</text>
          <text x="812" y="483" font-size="12.5" fill="#4a5468">frame count first, the reply audio at the end</text>
          <rect x="796" y="510" width="348" height="52" rx="5" fill="#f5f7fa" stroke="#d3d9e3"/>
          <text x="812" y="531" font-size="14" font-weight="700" fill="#121a2a">Idle cache</text>
          <text x="812" y="549" font-size="12.5" fill="#4a5468">4 s of real frames while the avatar is silent</text>
          <line x1="970" y1="356" x2="970" y2="370" stroke="#121a2a" stroke-width="1.5" marker-end="url(#sa)"/>
          <line x1="970" y1="428" x2="970" y2="442" stroke="#121a2a" stroke-width="1.5" marker-end="url(#sa)"/>
          <line x1="1110" y1="510" x2="1110" y2="496" stroke="#121a2a" stroke-width="1.5" marker-end="url(#sa)"/>

          <!-- 1: token -->
          <path d="M200,430 V536 H318" fill="none" stroke="#121a2a" stroke-width="1.6" marker-end="url(#sa)"/>
          <circle cx="56" cy="486" r="9" fill="#121a2a"/>
          <text x="56" y="490" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
          <text x="72" y="490" font-size="13" fill="#121a2a">access token</text>

          <!-- 2: WebRTC both ways -->
          <path d="M100,280 V102 H318" fill="none" stroke="#121a2a" stroke-width="1.6" marker-start="url(#sa)" marker-end="url(#sa)"/>
          <circle cx="116" cy="186" r="9" fill="#121a2a"/>
          <text x="116" y="190" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
          <text x="132" y="184" font-size="13" fill="#121a2a">mic audio up,</text>
          <text x="132" y="201" font-size="13" fill="#121a2a">avatar down</text>

          <!-- 3: user audio to agent -->
          <line x1="370" y1="146" x2="370" y2="266" stroke="#121a2a" stroke-width="1.6" marker-end="url(#sa)"/>
          <circle cx="385" cy="196" r="9" fill="#121a2a"/>
          <text x="385" y="200" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
          <text x="399" y="200" font-size="12.5" fill="#121a2a">user audio</text>

          <!-- 9: publish back -->
          <line x1="470" y1="266" x2="470" y2="146" stroke="#121a2a" stroke-width="1.6" marker-end="url(#sa)"/>
          <circle cx="482" cy="192" r="9" fill="#121a2a"/>
          <text x="482" y="196" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">9</text>
          <text x="496" y="190" font-size="12.5" fill="#121a2a">publish</text>
          <text x="496" y="206" font-size="12.5" fill="#121a2a">audio + video</text>

          <!-- 5 and 6: Gemini round trip -->
          <path d="M590,308 V104 H876" fill="none" stroke="#121a2a" stroke-width="1.6" marker-end="url(#sa)"/>
          <circle cx="700" cy="90" r="9" fill="#121a2a"/>
          <text x="700" y="94" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
          <text x="714" y="94" font-size="13" fill="#121a2a">user speech · 16 kHz</text>
          <path d="M876,126 H630 V308" fill="none" stroke="#121a2a" stroke-width="1.6" marker-end="url(#sa)"/>
          <circle cx="700" cy="150" r="9" fill="#121a2a"/>
          <text x="700" y="154" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">6</text>
          <text x="714" y="154" font-size="13" fill="#121a2a">Bangla reply · 24 kHz + transcript</text>

          <!-- 7: reply audio to avatar -->
          <line x1="662" y1="322" x2="794" y2="322" stroke="#121a2a" stroke-width="1.6" marker-end="url(#sa)"/>
          <circle cx="676" cy="306" r="9" fill="#121a2a"/>
          <text x="676" y="310" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">7</text>
          <text x="690" y="310" font-size="12.5" fill="#121a2a">reply audio</text>
          <text x="690" y="340" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#7a8396">WEBSOCKET</text>

          <!-- 8: frames back -->
          <line x1="794" y1="408" x2="648" y2="408" stroke="#121a2a" stroke-width="1.6" marker-end="url(#sa)"/>
          <circle cx="676" cy="392" r="9" fill="#121a2a"/>
          <text x="676" y="396" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">8</text>
          <text x="690" y="396" font-size="12.5" fill="#121a2a">frames</text>
          <text x="690" y="426" font-size="12.5" fill="#121a2a">+ reply audio</text>
        </svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg width="1320" height="600" viewBox="0 0 1320 600" role="img" aria-label="Alapon is a U-Net. A fixed reference frame and the current frame with mouth and jaw hidden form a 6 by 320 by 320 input, encoded down to 10 by 10. Audio becomes a mel spectrogram, passes a pretrained audio encoder, and joins the face at the 10 by 10 bottleneck. The decoder upsamples back to 320 with skip connections, producing the mouth, which is colour-corrected, feathered and pasted into the full frame. During training only, four losses including a Bangla lip-sync expert shape the output." font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#121a2a"/></marker>
            <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
            <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8396"/></marker>
          </defs>
          <rect x="0" y="0" width="1320" height="600" fill="#ffffff"/>

          <!-- inputs -->
          <text x="30" y="44" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" letter-spacing="1.1" fill="#7a8396">FACE CROP OF EACH 1080 × 1080 FRAME</text>
          <rect x="30" y="70" width="86" height="86" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.5"/>
          <ellipse cx="73" cy="113" rx="28" ry="36" fill="#e6ebf2"/>
          <path d="M61,131 Q73,138 85,131" fill="none" stroke="#8d97a8" stroke-width="2"/>
          <rect x="136" y="70" width="86" height="86" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.5"/>
          <ellipse cx="179" cy="113" rx="28" ry="36" fill="#e6ebf2"/>
          <rect x="141" y="104" width="76" height="52" fill="#121a2a"/>
          <line x1="141" y1="152" x2="217" y2="152" stroke="#eb6834" stroke-width="2" stroke-dasharray="4 3"/>
          <text x="73" y="176" font-size="13" font-weight="700" fill="#121a2a" text-anchor="middle">Reference</text>
          <text x="73" y="192" font-size="12" fill="#4a5468" text-anchor="middle">one fixed frame</text>
          <text x="179" y="176" font-size="13" font-weight="700" fill="#121a2a" text-anchor="middle">Current frame</text>
          <text x="179" y="192" font-size="12" fill="#4a5468" text-anchor="middle">mouth + jaw hidden</text>
          <text x="30" y="224" font-size="12" fill="#b4461c">Dashed line: where the original mask</text>
          <text x="30" y="240" font-size="12" fill="#b4461c">stopped, leaving the jaw visible</text>
          <line x1="226" y1="118" x2="372" y2="118" stroke="#121a2a" stroke-width="1.6" marker-end="url(#ma)"/>
          <text x="299" y="108" font-family="IBM Plex Mono, Consolas, monospace" font-size="11.5" fill="#121a2a" text-anchor="middle">6 × 320 × 320</text>

          <!-- skip connections (behind blocks) -->
          <g stroke="#9aa3b2" stroke-width="1.3" stroke-dasharray="5 4" fill="none">
            <line x1="405" y1="102" x2="998" y2="102" marker-end="url(#mg)"/>
            <line x1="460" y1="162" x2="943" y2="162" marker-end="url(#mg)"/>
            <line x1="515" y1="219.5" x2="888" y2="219.5" marker-end="url(#mg)"/>
            <line x1="570" y1="274" x2="833" y2="274" marker-end="url(#mg)"/>
            <line x1="625" y1="326" x2="778" y2="326" marker-end="url(#mg)"/>
          </g>
          <text x="700" y="95" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#7a8396" text-anchor="middle">SKIP CONNECTIONS</text>

          <!-- encoder -->
          <g fill="#dfe6f0" stroke="#b3bfd0" stroke-width="1.2">
            <rect x="375" y="90" width="30" height="140"/>
            <rect x="430" y="150" width="30" height="110"/>
            <rect x="485" y="207.5" width="30" height="85"/>
            <rect x="540" y="262" width="30" height="66"/>
            <rect x="595" y="314" width="30" height="52"/>
            <rect x="650" y="365" width="30" height="40"/>
          </g>
          <!-- decoder -->
          <g fill="#dfe6f0" stroke="#b3bfd0" stroke-width="1.2">
            <rect x="780" y="314" width="30" height="52"/>
            <rect x="835" y="262" width="30" height="66"/>
            <rect x="890" y="207.5" width="30" height="85"/>
            <rect x="945" y="150" width="30" height="110"/>
            <rect x="1000" y="90" width="30" height="140"/>
          </g>
          <rect x="1055" y="90" width="30" height="140" fill="#2a78d6"/>
          <rect x="708" y="410" width="44" height="40" rx="3" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.8"/>

          <g font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#4a5468" text-anchor="middle">
            <text x="390" y="82">320</text>
            <text x="445" y="142">160</text>
            <text x="500" y="199">80</text>
            <text x="555" y="254">40</text>
            <text x="610" y="306">20</text>
            <text x="665" y="357">10</text>
            <text x="795" y="306">20</text>
            <text x="850" y="254">40</text>
            <text x="905" y="199">80</text>
            <text x="960" y="142">160</text>
            <text x="1015" y="82">320</text>
            <text x="1070" y="82">3 ch</text>
          </g>

          <!-- down / up path -->
          <g stroke="#121a2a" stroke-width="1.4" fill="none">
            <line x1="405" y1="160" x2="428" y2="203" marker-end="url(#ma)"/>
            <line x1="460" y1="205" x2="483" y2="248" marker-end="url(#ma)"/>
            <line x1="515" y1="250" x2="538" y2="293" marker-end="url(#ma)"/>
            <line x1="570" y1="295" x2="593" y2="338" marker-end="url(#ma)"/>
            <line x1="625" y1="340" x2="648" y2="383" marker-end="url(#ma)"/>
            <line x1="680" y1="390" x2="706" y2="424" marker-end="url(#ma)"/>
            <line x1="752" y1="424" x2="778" y2="344" marker-end="url(#ma)"/>
            <line x1="810" y1="340" x2="833" y2="297" marker-end="url(#ma)"/>
            <line x1="865" y1="295" x2="888" y2="252" marker-end="url(#ma)"/>
            <line x1="920" y1="250" x2="943" y2="207" marker-end="url(#ma)"/>
            <line x1="975" y1="205" x2="998" y2="162" marker-end="url(#ma)"/>
            <line x1="1030" y1="160" x2="1053" y2="160" marker-end="url(#ma)"/>
          </g>
          <text x="500" y="382" font-size="13" font-weight="700" fill="#121a2a" text-anchor="middle">Face encoder</text>
          <text x="500" y="398" font-size="12" fill="#4a5468" text-anchor="middle">halves the size 5 times</text>
          <text x="905" y="382" font-size="13" font-weight="700" fill="#121a2a" text-anchor="middle">Decoder</text>
          <text x="905" y="398" font-size="12" fill="#4a5468" text-anchor="middle">doubles it back to 320</text>
          <text x="764" y="440" font-size="12.5" font-weight="700" fill="#1c5cab">audio joins the face here</text>
          <text x="764" y="456" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#1c5cab">512 + 512 → fuse → 256</text>

          <!-- audio branch -->
          <g font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">
            <rect x="20" y="474" width="118" height="46" rx="5" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.4"/>
            <text x="32" y="494" font-size="13" font-weight="700" fill="#121a2a">Reply audio</text>
            <text x="32" y="511" font-size="12" fill="#4a5468">16 kHz, streamed</text>
            <rect x="158" y="474" width="112" height="46" rx="5" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.4"/>
            <text x="170" y="494" font-size="13" font-weight="700" fill="#121a2a">Mel spectrum</text>
            <text x="170" y="511" font-size="12" fill="#4a5468">80 bins</text>
            <rect x="290" y="474" width="150" height="46" rx="5" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.4"/>
            <text x="302" y="494" font-size="13" font-weight="700" fill="#121a2a">Audio encoder</text>
            <text x="302" y="511" font-size="12" fill="#4a5468">pretrained, frozen</text>
            <rect x="460" y="474" width="128" height="46" rx="5" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.4"/>
            <text x="472" y="494" font-size="13" font-weight="700" fill="#121a2a">16-frame window</text>
            <text x="472" y="511" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#4a5468">32 × 16 × 16</text>
            <rect x="608" y="474" width="126" height="46" rx="5" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.4"/>
            <text x="620" y="494" font-size="13" font-weight="700" fill="#121a2a">Audio conv</text>
            <text x="620" y="511" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#4a5468">→ 512 × 10 × 10</text>
          </g>
          <g stroke="#121a2a" stroke-width="1.4">
            <line x1="138" y1="497" x2="156" y2="497" marker-end="url(#ma)"/>
            <line x1="270" y1="497" x2="288" y2="497" marker-end="url(#ma)"/>
            <line x1="440" y1="497" x2="458" y2="497" marker-end="url(#ma)"/>
            <line x1="588" y1="497" x2="606" y2="497" marker-end="url(#ma)"/>
          </g>
          <line x1="690" y1="474" x2="718" y2="453" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#mb)"/>

          <!-- output and post-processing -->
          <text x="1070" y="248" font-size="12.5" font-weight="700" fill="#1c5cab" text-anchor="middle">mouth</text>
          <line x1="1085" y1="112" x2="1108" y2="112" stroke="#121a2a" stroke-width="1.4" marker-end="url(#ma)"/>
          <g>
            <rect x="1110" y="90" width="190" height="44" rx="5" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.4"/>
            <text x="1122" y="109" font-size="13" font-weight="700" fill="#121a2a">Chroma fix</text>
            <text x="1122" y="125" font-size="12" fill="#4a5468">removes invented blue</text>
            <rect x="1110" y="148" width="190" height="44" rx="5" fill="#ffffff" stroke="#b9c2d0" stroke-width="1.4"/>
            <text x="1122" y="167" font-size="13" font-weight="700" fill="#121a2a">Feather the edge</text>
            <text x="1122" y="183" font-size="12" fill="#4a5468">blend the bottom 16 rows</text>
            <rect x="1110" y="206" width="190" height="44" rx="5" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
            <text x="1122" y="225" font-size="13" font-weight="700" fill="#1c5cab">Paste back</text>
            <text x="1122" y="241" font-size="12" fill="#1c5cab">into the 1080 × 1080 frame</text>
          </g>
          <line x1="1205" y1="134" x2="1205" y2="146" stroke="#121a2a" stroke-width="1.4" marker-end="url(#ma)"/>
          <line x1="1205" y1="192" x2="1205" y2="204" stroke="#121a2a" stroke-width="1.4" marker-end="url(#ma)"/>

          <!-- training only -->
          <line x1="1070" y1="256" x2="1070" y2="478" stroke="#7a8396" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#mg)"/>
          <text x="1080" y="330" font-size="12" fill="#4a5468">compared with</text>
          <text x="1080" y="346" font-size="12" fill="#4a5468">the real frame</text>
          <rect x="800" y="480" width="500" height="104" rx="6" fill="#fafbfc" stroke="#9aa3b2" stroke-width="1.3" stroke-dasharray="6 4"/>
          <text x="816" y="502" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" letter-spacing="1.1" fill="#7a8396">TRAINING ONLY · 4 LOSSES</text>
          <text x="816" y="526" font-size="13" fill="#121a2a">L1 pixel loss</text>
          <text x="816" y="548" font-size="13" fill="#121a2a">VGG19 perceptual × 0.01</text>
          <text x="816" y="570" font-size="13" fill="#121a2a">Chroma loss × 1.0</text>
          <text x="1040" y="526" font-size="13" font-weight="700" fill="#1c5cab">Bangla lip-sync expert</text>
          <text x="1040" y="548" font-size="13" fill="#121a2a">mouth vs audio, × 0.03</text>
          <text x="1040" y="570" font-size="13" fill="#121a2a">switched on from epoch 5</text>
        </svg>